services:
  db:
    image: postgres:16-alpine
    container_name: radius_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-backend_radius}
      POSTGRES_USER: ${DB_USER:-backend_radius}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-radius_secret_2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-backend_radius} -d ${DB_NAME:-backend_radius}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: radius_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-radius_redis_2024} --appendonly yes --appendfsync everysec --save 3600 1 --save 300 100 --save 60 10000
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-radius_redis_2024}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radius_app
    restart: unless-stopped
    env_file:
      - .env
    # WireGuard interface (wg0) is created by the entrypoint; needs NET_ADMIN +
    # the wireguard kernel module on the host. Without WG_PRIVATE_KEY the app
    # simply falls back to Direct / IP-Publik mode.
    cap_add:
      - NET_ADMIN
    environment:
      # VPN legacy L2TP/SSTP (container 'vpn'): app menulis chap-secrets ke
      # volume bersama dan menambah route subnet legacy via container vpn.
      - LEGACY_VPN_SECRETS_FILE=/vpn/chap-secrets
      - LEGACY_VPN_HOST=vpn
      - LEGACY_VPN_SUBNET=${LEGACY_VPN_SUBNET:-10.78.0.0/24}
      - LEGACY_VPN_GW=${LEGACY_VPN_GW:-10.78.0.1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./keys:/app/keys
      - storage:/app/storage
      - vpn_secrets:/vpn
      - ./docs/swagger.json:/app/docs/swagger.json:ro
      - ./static/swagger.html:/app/static/swagger.html:ro
    expose:
      - "3000"
      - "1812/udp"
      - "1813/udp"
    ports:
      - "3000:3000"
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "51820:51820/udp"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radius_worker
    restart: unless-stopped
    command: ["./worker"]
    env_file:
      - .env
    # NET_ADMIN + LEGACY_VPN_HOST: worker mengirim CoA/isolir langsung ke router,
    # jadi butuh route ke subnet VPN legacy via container vpn (lihat entrypoint.sh).
    cap_add:
      - NET_ADMIN
    environment:
      - LEGACY_VPN_HOST=vpn
      - LEGACY_VPN_SUBNET=${LEGACY_VPN_SUBNET:-10.78.0.0/24}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  # Konsentrator VPN legacy (L2TP + SSTP, accel-ppp) untuk router yang tidak
  # bisa WireGuard: RouterOS 6 dan/atau router di belakang NAT ISP. Router
  # mendapat IP statis dari /vpn/chap-secrets yang ditulis app. privileged
  # diperlukan untuk modprobe modul l2tp/ppp host + akses /dev/ppp.
  vpn:
    build:
      context: ./vpn
    container_name: radius_vpn
    restart: unless-stopped
    privileged: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - LEGACY_VPN_GW=${LEGACY_VPN_GW:-10.78.0.1}
      - LEGACY_VPN_SUBNET=${LEGACY_VPN_SUBNET:-10.78.0.0/24}
      - LEGACY_VPN_L2TP_PORT=${LEGACY_VPN_L2TP_PORT:-1701}
      - LEGACY_VPN_SSTP_PORT=${LEGACY_VPN_SSTP_PORT:-5443}
      - LEGACY_VPN_APP_HOST=app
    volumes:
      - vpn_secrets:/vpn
      - /lib/modules:/lib/modules:ro
    ports:
      - "1701:1701/udp"
      - "5443:5443"
    depends_on:
      app:
        condition: service_started

  wa:
    build:
      context: ../wa-radius
      dockerfile: Dockerfile
    container_name: radius_wa
    restart: unless-stopped
    env_file:
      - ../wa-radius/.env
    environment:
      - DATABASE_URL=postgresql://backend_radius:radius_secret_2024@db:5432/backend_radius?sslmode=disable
    expose:
      - "3002"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  nginx:
    build:
      context: ..
      dockerfile: backend-radius/nginx/Dockerfile
    container_name: radius_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - app
      - wa
    networks:
      - default
      - web

  # n8n — CS bot automation for tenants. Reachable internally by the WA service at
  # http://n8n:5678 (same default network); UI published on localhost only (access
  # via SSH tunnel: ssh -L 5678:localhost:5678 <server> → http://localhost:5678).
  # --- GenieACS TR-069 (CWMP) stack ---------------------------------------
  # ONT/CPE management. ONTs inform to http://acs.dradius.net/cwmp (DNS-only,
  # bypass Cloudflare) -> proxy_nginx -> radius_nginx -> app:3000 /cwmp -> genieacs-cwmp.
  # genieacs-nbi (REST). All internal-only (same default network); nothing
  # published to the host except via the app.
  acs_mongo:
    image: mongo:4.4
    container_name: radius_acs_mongo
    restart: unless-stopped
    volumes:
      - acs_mongodata:/data/db
    networks:
      - default
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  genieacs-cwmp:
    build:
      context: ./genieacs
      dockerfile: Dockerfile
    image: radius-genieacs:1.2.13
    container_name: radius_genieacs_cwmp
    restart: unless-stopped
    command: ["genieacs-cwmp"]
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=mongodb://acs_mongo:27017/genieacs
      - GENIEACS_CWMP_INTERFACE=0.0.0.0
      - GENIEACS_CWMP_PORT=7547
      - GENIEACS_EXT_DIR=/opt/genieacs/ext
    depends_on:
      acs_mongo:
        condition: service_healthy
    expose:
      - "7547"
    networks:
      - default

  genieacs-nbi:
    image: radius-genieacs:1.2.13
    container_name: radius_genieacs_nbi
    restart: unless-stopped
    command: ["genieacs-nbi"]
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=mongodb://acs_mongo:27017/genieacs
      - GENIEACS_NBI_INTERFACE=0.0.0.0
      - GENIEACS_NBI_PORT=7557
      - GENIEACS_EXT_DIR=/opt/genieacs/ext
    depends_on:
      acs_mongo:
        condition: service_healthy
      genieacs-cwmp:
        condition: service_started
    expose:
      - "7557"
    networks:
      - default

  genieacs-fs:
    image: radius-genieacs:1.2.13
    container_name: radius_genieacs_fs
    restart: unless-stopped
    command: ["genieacs-fs"]
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=mongodb://acs_mongo:27017/genieacs
      - GENIEACS_FS_INTERFACE=0.0.0.0
      - GENIEACS_FS_PORT=7567
      - GENIEACS_EXT_DIR=/opt/genieacs/ext
    depends_on:
      acs_mongo:
        condition: service_healthy
    expose:
      - "7567"
    networks:
      - default

  n8n:
    image: n8nio/n8n:1.112.6
    container_name: radius_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Jakarta
      - TZ=Asia/Jakarta
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678/
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - default

volumes:
  pgdata:
  redisdata:
  storage:
  n8n_data:
  acs_mongodata:
  vpn_secrets:

# 'web' = network bersama reverse-proxy (proxy_nginx). Hanya nginx publik yang join.
networks:
  web:
    name: web
    external: true
