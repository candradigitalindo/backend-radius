          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Daftar notifikasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/MobileNotification" }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }

  /mobile/notifications/{id}/read:
    put:
      tags: [MobileNotifications]
      summary: Tandai notifikasi sudah dibaca
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Notifikasi ditandai dibaca
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /mobile/notifications/read-all:
    put:
      tags: [MobileNotifications]
      summary: Tandai semua notifikasi sudah dibaca
      responses:
        "200":
          description: Semua notifikasi ditandai dibaca
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /mobile/notifications/unread-count:
    get:
