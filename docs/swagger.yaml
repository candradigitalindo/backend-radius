        tenant_id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        phone: { type: string }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    # ── Mobile Schemas ──
    MobileTokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, example: 900 }

    MobileCustomer:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        customer_code: { type: string, example: "260327001" }
        name: { type: string, example: "Candra" }
        phone: { type: string, example: "081260268381" }
        email: { type: string }
        address: { type: string }
        connection_type: { type: string, enum: [pppoe, static, dhcp] }
        status: { type: string, enum: [active, isolated, inactive] }
        join_date: { type: string, format: date-time }
        billing_date: { type: integer, example: 1 }
        package:
          $ref: "#/components/schemas/MobilePackage"

    MobileCustomerDetail:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        customer_code: { type: string }
        name: { type: string }
        nik: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        connection_type: { type: string }
        pppoe_username: { type: string }
        ip_address: { type: string }
        join_date: { type: string, format: date-time }
        billing_date: { type: integer }
        billing_type: { type: string }
        custom_price: { type: integer, nullable: true }
        discount: { type: integer }
        additional_fee: { type: integer }
        fee_description: { type: string }
        status: { type: string }
        isolated_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        package:
          $ref: "#/components/schemas/MobilePackage"
        router:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }

    MobileInvoice:
      type: object
      properties:
        id: { type: string }
        invoice_number: { type: string, example: "INV-2026-04-001" }
        period_month: { type: integer, example: 4 }
        period_year: { type: integer, example: 2026 }
        package_price: { type: integer, example: 150000 }
        discount: { type: integer }
        additional_fee: { type: integer }
        fee_description: { type: string }
        total_amount: { type: integer, example: 150000 }
        status: { type: string, enum: [unpaid, paid, overdue, cancelled] }
        due_date: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        paid_amount: { type: integer, nullable: true }
        payment_method: { type: string, nullable: true }
        notes: { type: string }
        auto_generated: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MobilePackage:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: "Paket 20 Mbps" }
        description: { type: string }
        bandwidth_up: { type: integer, example: 20 }
        bandwidth_down: { type: integer, example: 20 }
        price: { type: integer, example: 150000 }
        is_active: { type: boolean }

    MobileTicket:
      type: object
      properties:
        id: { type: string }
        ticket_number: { type: string, example: "TIK-2026-001" }
        subject: { type: string }
        description: { type: string }
        category: { type: string, enum: [general, gangguan, billing, upgrade, lainnya] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [open, in_progress, resolved, closed] }
        assigned_to: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MobileNotification:
      type: object
      properties:
        id: { type: string }
        title: { type: string, example: "Tagihan Bulan April" }
        body: { type: string }
        data: { type: string, description: "JSON string for deep-link routing" }
        is_read: { type: boolean }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    PerPageParam:
      name: per_page
      in: query
      schema: { type: integer, default: 20 }
    SearchParam:
      name: search
      in: query
      schema: { type: string }
    IDPath:
      name: id
      in: path
      required: true
      schema: { type: string }

  schemas:
    Reward:
      type: object
      properties:
        id: { type: string, example: "01JTEST00001" }
        tenant_id: { type: string }
        name: { type: string, example: "Reward Referral Standar" }
        description: { type: string }
        type: { type: string, enum: [referral, loyalty, promo] }
        value: { type: integer, example: 50000 }
        value_type: { type: string, enum: [fixed, percentage] }
        min_invoices: { type: integer, example: 1 }
        is_active: { type: boolean }
        start_date: { type: string, format: date-time, nullable: true }
        end_date: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RewardInput:
      type: object
      required: [name, type, value_type]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [referral, loyalty, promo] }
        value: { type: integer }
        value_type: { type: string, enum: [fixed, percentage] }
        min_invoices: { type: integer }
        is_active: { type: boolean }
        start_date: { type: string, format: date-time, nullable: true }
        end_date: { type: string, format: date-time, nullable: true }

    RewardStats:
      type: object
      properties:
        total_referrals: { type: integer }
        qualified_referrals: { type: integer }
        total_rewarded: { type: integer }
        pending_claims: { type: integer }
        active_rewards: { type: integer }

    RewardDashboard:
      type: object
      properties:
        stats: { $ref: "#/components/schemas/RewardStats" }
        monthly_trends:
          type: array
          items:
            type: object
            properties:
              year: { type: integer }
              month: { type: integer }
              referrals: { type: integer }
              qualified: { type: integer }
              claims: { type: integer }
              claimed_amount: { type: integer }
        top_referrers:
          type: array
          items:
            type: object
            properties:
              customer_id: { type: string }
              customer_name: { type: string }
              referral_count: { type: integer }
              qualified_count: { type: integer }
              total_rewarded: { type: integer }
        recent_referrals:
          type: array
          items: { $ref: "#/components/schemas/Referral" }
        recent_claims:
          type: array
          items: { $ref: "#/components/schemas/RewardClaim" }
        claim_breakdown:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              status: { type: string }
              count: { type: integer }
              total_amount: { type: integer }

    Referral:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        referrer_id: { type: string }
        referrer_name: { type: string }
        referred_id: { type: string }
        referred_name: { type: string }
        reward_id: { type: string }
        referral_code: { type: string }
        status: { type: string, enum: [pending, qualified, rewarded, expired] }
        reward_amount: { type: integer }
        qualified_at: { type: string, format: date-time, nullable: true }
        rewarded_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    RewardClaim:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        customer_id: { type: string }
        customer_name: { type: string }
        reward_id: { type: string }
        reward_name: { type: string }
        referral_id: { type: string, nullable: true }
        amount: { type: integer }
        type: { type: string, enum: [balance_credit, invoice_discount] }
        status: { type: string, enum: [pending, applied, expired] }
        applied_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - BearerAuth: []

paths:
  # ── Health ──
  /health:
    get:
      tags: [Dashboard]
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string }

  # ── Auth ──
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                tenant_id: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                phone: { type: string }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                tenant_id: { type: string }
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  # ── Customers ──
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/PerPageParam" }
        - { $ref: "#/components/parameters/SearchParam" }
        - { name: status, in: query, schema: { type: string } }
        - { name: router_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Paginated customer list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PaginationMeta" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Customer" }
    post:
      tags: [Customers]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCreate" }
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /customers/{id}:
    get:
      tags: [Customers]
      summary: Get customer by ID
      parameters: [{ $ref: "#/components/parameters/IDPath" }]
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerDetailResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Customers]
      summary: Update customer profile
      parameters: [{ $ref: "#/components/parameters/IDPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerProfileUpdate" }
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Customers]
      summary: Delete customer
      parameters: [{ $ref: "#/components/parameters/IDPath" }]
      responses:
        "200":
          description: Deleted
          content:
