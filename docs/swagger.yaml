        max_customers: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TenantCreate:
      type: object
      required: [name, slug, email]
      properties:
        name: { type: string }
        slug: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        timezone: { type: string }
        currency: { type: string }
        billing_cycle: { type: integer }
        due_day: { type: integer }
        isolir_day: { type: integer }
        grace_period: { type: integer }
        plan: { type: string }
        max_customers: { type: integer }

    User:
      type: object
      properties:
