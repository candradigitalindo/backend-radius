                device_type: { type: string, enum: [android, ios] }
                fcm_token: { type: string }
      responses:
        "201":
          description: Perangkat terdaftar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /mobile/notifications/unregister-device:
    delete:
      tags: [MobileNotifications]
      summary: Unregister device (saat logout)
