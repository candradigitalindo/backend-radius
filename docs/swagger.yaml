openapi: "3.0.3"
info:
  title: ISP Billing Platform API
  description: |
    Multi-tenant SaaS backend for ISP billing, FTTH network management, and TR-069 device provisioning.
    All protected endpoints require a valid JWT Bearer token in the Authorization header.
    Tenant isolation is enforced automatically via JWT claims.
  version: "1.0.0"
  contact:
    name: API Support

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Auth
    description: Authentication & user management
  - name: Customers
    description: Customer management
  - name: Packages
    description: Internet packages / plans
  - name: Routers
    description: MikroTik router management
  - name: Invoices
    description: Invoice & billing
  - name: Payments
    description: Payment records
  - name: Tickets
    description: Support tickets
  - name: OLTs
    description: Optical Line Terminals
  - name: ODPs
    description: Optical Distribution Points
  - name: Splitters
    description: Fiber splitters
  - name: ONTs
    description: Optical Network Terminals
  - name: GenieACS
    description: TR-069 device management via GenieACS
  - name: FTTH
    description: FTTH network dashboard
  - name: Vouchers
    description: Hotspot voucher management
  - name: VoucherProducts
    description: Voucher product catalog
  - name: Expenses
    description: Expense tracking
  - name: ExpenseCategories
    description: Expense categories
  - name: Reminders
    description: Invoice reminder management
  - name: WhatsApp
    description: WhatsApp session management
  - name: Broadcasts
    description: Message broadcasts
  - name: CustomerLogs
    description: Customer activity logs
  - name: Settings
    description: Tenant settings
  - name: Tenants
    description: Tenant management (superadmin)
  - name: Dashboard
    description: Dashboard & analytics
  - name: Mobile
    description: Mobile app API (customer-facing)
  - name: MobileNotifications
    description: Mobile push notification management
  - name: Rewards
    description: Reward program management
  - name: Referrals
    description: Customer referral tracking
  - name: RewardClaims
    description: Reward claim management

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Message:
      type: object
      properties:
        message:
          type: string

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    Customer:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        customer_code: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        connection_type: { type: string }
        pppoe_username: { type: string }
        pppoe_password: { type: string }
        ip_address: { type: string }
        package_id: { type: string, nullable: true }
        router_id: { type: string, nullable: true }
        odp_port_id: { type: string, nullable: true }
        join_date: { type: string, format: date-time }
        billing_date: { type: integer }
        custom_price: { type: integer, nullable: true }
        discount: { type: integer }
        additional_fee: { type: integer }
        fee_description: { type: string }
        status: { type: string }
        isolated_at: { type: string, format: date-time, nullable: true }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        package: { $ref: "#/components/schemas/Package" }
        router: { $ref: "#/components/schemas/Router" }

    CustomerDetailResponse:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        customer_code: { type: string }
        name: { type: string }
        nik: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        package_id: { type: string, nullable: true }
        router_id: { type: string, nullable: true }
        odp_port_id: { type: string, nullable: true }
        status: { type: string }
        notes: { type: string }
        access: { $ref: "#/components/schemas/CustomerAccess" }
        billing: { $ref: "#/components/schemas/CustomerBilling" }
        connection: { $ref: "#/components/schemas/CustomerConnection" }
        package: { $ref: "#/components/schemas/CustomerPackageSummary" }
        router: { $ref: "#/components/schemas/CustomerRouterSummary" }
        ont: { $ref: "#/components/schemas/CustomerONTDetail" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CustomerAccess:
      type: object
      properties:
        pppoe_username: { type: string }
        pppoe_password: { type: string }
        acs_url: { type: string, nullable: true }

    CustomerBilling:
      type: object
      properties:
        join_date: { type: string, format: date-time }
        billing_date: { type: integer }
        invoice_date: { type: string, format: date-time, nullable: true }
        billing_type: { type: string }
        billing_deadline: { type: integer }
        billing_due_date: { type: string, format: date-time, nullable: true }
        custom_price: { type: integer, nullable: true }
        discount: { type: integer }
        additional_fee: { type: integer }
        fee_description: { type: string }
        current_invoice: { $ref: "#/components/schemas/CustomerInvoiceSummary" }

    CustomerConnection:
      type: object
      properties:
        type: { type: string }
        status: { type: string }
        configured_ip: { type: string }
        current_ip: { type: string }
        download: { type: integer }
        upload: { type: integer }
        realtime_download_mbps: { type: number }
        realtime_upload_mbps: { type: number }
        realtime_sampled_at: { type: string, format: date-time, nullable: true }
        active_session: { $ref: "#/components/schemas/CustomerActiveSessionSummary" }

    CustomerPackageSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        bandwidth_up: { type: integer }
        bandwidth_down: { type: integer }
        price: { type: integer }
        burst_limit: { type: string }
        address_list: { type: string }

    CustomerRouterSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        vpn_ip: { type: string }
        coa_port: { type: integer }

    CustomerInvoiceSummary:
      type: object
      properties:
        id: { type: string }
        invoice_number: { type: string }
        period_month: { type: integer }
        period_year: { type: integer }
        package_price: { type: integer }
        discount: { type: integer }
        additional_fee: { type: integer }
        fee_description: { type: string }
        total_amount: { type: integer }
        status: { type: string }
        due_date: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        paid_amount: { type: integer, nullable: true }
        payment_method: { type: string, nullable: true }
        auto_generated: { type: boolean }

    CustomerActiveSessionSummary:
      type: object
      properties:
        id: { type: string }
        session_id: { type: string }
        nas_ip_address: { type: string }
        caller_id: { type: string }
        input_octets: { type: integer }
        output_octets: { type: integer }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        session_time: { type: integer }
        terminate_cause: { type: string }

    CustomerONTDetail:
      type: object
      properties:
        id: { type: string }
        serial_number: { type: string }
        model: { type: string, nullable: true }
        vendor: { type: string, nullable: true }
        status: { type: string }
        provisioned_at: { type: string, format: date-time, nullable: true }
        last_online_at: { type: string, format: date-time, nullable: true }
        device: { $ref: "#/components/schemas/CustomerONTDevice" }
        signal: { $ref: "#/components/schemas/CustomerONTSignal" }
        wifi: { $ref: "#/components/schemas/CustomerONTWiFi" }
        network: { $ref: "#/components/schemas/CustomerONTNetwork" }
        connected_hosts: { $ref: "#/components/schemas/CustomerONTConnectedHosts" }
        actions: { $ref: "#/components/schemas/ONTAvailableActions" }

    CustomerONTDevice:
      type: object
      properties:
        device_id: { type: string }
        software_version: { type: string }
        last_inform: { type: string }
        data_realtime: { type: boolean }
        uptime: { type: integer, nullable: true }

    CustomerONTSignal:
      type: object
      properties:
        rx_power: { type: number, nullable: true }
        tx_power: { type: number, nullable: true }

    CustomerONTWiFi:
      type: object
      properties:
        ssid: { type: string }
        password: { type: string }
        password_reported: { type: boolean }
        password_source: { type: string }
        security: { type: string }
        security_modes:
          type: array
          items: { type: string }

    CustomerONTNetwork:
      type: object
      properties:
        wan_ip: { type: string }

    CustomerONTConnectedHosts:
      type: object
      properties:
        count: { type: integer }
        complete: { type: boolean }
        source: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerONTConnectedHost" }

    CustomerONTConnectedHost:
      type: object
      properties:
        ip_address: { type: string }
        mac_address: { type: string }
        hostname: { type: string }
        interface_type: { type: string }
        active: { type: boolean }

    ONTAvailableActions:
      type: object
      properties:
        can_restart: { type: boolean }
        can_manage_wifi: { type: boolean }

    CustomerCreate:
      type: object
      required: [customer_code, name]
      properties:
        customer_code: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        connection_type: { type: string }
        pppoe_username: { type: string }
        pppoe_password: { type: string }
        ip_address: { type: string }
        package_id: { type: string }
        router_id: { type: string }
        odp_port_id: { type: string }
        billing_date: { type: integer }
        custom_price: { type: integer }
        discount: { type: integer }
        additional_fee: { type: integer }
        fee_description: { type: string }
        notes: { type: string }

    CustomerProfileUpdate:
      type: object
      properties:
        name: { type: string }
        nik: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        notes: { type: string }

    CustomerAccessUpdate:
      type: object
      properties:
        connection_type: { type: string }
        pppoe_username: { type: string }
        pppoe_password: { type: string }
        ip_address: { type: string }
        router_id: { type: string, nullable: true }
        odp_port_id: { type: string, nullable: true }

    CustomerServiceUpdate:
      type: object
      properties:
        package_id: { type: string, nullable: true }
        join_date: { type: string, format: date }
        invoice_date: { type: string, format: date }
        billing_due_date: { type: string, format: date }
        billing_type: { type: string }
        custom_price: { type: integer }
        discount: { type: integer }
        additional_fee: { type: integer }
        fee_description: { type: string }

    SubscriptionPlan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        price: { type: integer }
        duration_months: { type: integer }
        max_customers: { type: integer }
        max_routers: { type: integer }
        features:
          type: array
          items: { type: string }
        is_popular: { type: boolean }
        is_active: { type: boolean }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SubscriptionOrder:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        plan_id: { type: string }
        plan_name: { type: string }
        amount: { type: integer }
        duration_months: { type: integer }
        status: { type: string }
        payment_method: { type: string }
        payment_url: { type: string }
        payment_ref: { type: string }
        paid_at: { type: string, format: date-time, nullable: true }
        starts_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SubscriptionSubscribeRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: string }
        duration_months: { type: integer, enum: [1, 12] }

    SubscriptionCreatePaymentRequest:
      type: object
      properties:
        return_url: { type: string }

    SubscriptionConfirmPaymentRequest:
      type: object
      properties:
        payment_method: { type: string }
        payment_ref: { type: string }

    Package:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        description: { type: string }
        bandwidth_up: { type: integer }
        bandwidth_down: { type: integer }
        price: { type: integer }
        burst_limit: { type: string }
        address_list: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PackageCreate:
      type: object
      required: [name, bandwidth_up, bandwidth_down, price]
      properties:
        name: { type: string }
        description: { type: string }
        bandwidth_up: { type: integer, minimum: 1 }
        bandwidth_down: { type: integer, minimum: 1 }
        price: { type: integer, minimum: 1 }
        burst_limit: { type: string }
        address_list: { type: string }
        is_active: { type: boolean }

    Router:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        identity: { type: string }
        vpn_ip: { type: string }
        vpn_public_key: { type: string }
        radius_secret: { type: string }
        coa_port: { type: integer }
        heartbeat_token: { type: string }
        is_online: { type: boolean }
        last_seen_at: { type: string, format: date-time, nullable: true }
        router_os_ver: { type: string, nullable: true }
        board_name: { type: string, nullable: true }
        uptime: { type: string, nullable: true }
        cpu_load: { type: integer, nullable: true }
        free_memory: { type: integer, nullable: true }
        total_memory: { type: integer, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RouterCreate:
      type: object
      required: [name, vpn_ip, radius_secret]
      properties:
        name: { type: string }
        identity: { type: string }
        vpn_ip: { type: string }
        vpn_public_key: { type: string }
        radius_secret: { type: string }
        coa_port: { type: integer }
        is_active: { type: boolean }

    RouterTraffic:
      type: object
      properties:
        router_id: { type: string }
        active_sessions: { type: integer }
        total_input_bytes: { type: integer }
        total_output_bytes: { type: integer }

    RadiusSession:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        router_id: { type: string }
        customer_id: { type: string }
        session_id: { type: string }
        username: { type: string }
        ip_address: { type: string }
        mac_address: { type: string }
        nas_ip: { type: string }
        input_octets: { type: integer }
        output_octets: { type: integer }
        session_time: { type: integer }
        terminate_cause: { type: string }
        started_at: { type: string, format: date-time }
        stopped_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Invoice:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        customer_id: { type: string }
        invoice_number: { type: string }
        period_month: { type: integer }
        period_year: { type: integer }
        package_price: { type: integer }
        discount: { type: integer }
        additional_fee: { type: integer }
        fee_description: { type: string }
        total_amount: { type: integer }
        status: { type: string }
        due_date: { type: string, format: date }
        paid_at: { type: string, format: date-time, nullable: true }
        paid_amount: { type: integer, nullable: true }
        payment_method: { type: string, nullable: true }
        notes: { type: string }
        auto_generated: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        customer: { $ref: "#/components/schemas/Customer" }

    InvoiceCreate:
      type: object
      required: [customer_id, period_month, period_year, package_price, due_date]
      properties:
        customer_id: { type: string }
        period_month: { type: integer }
        period_year: { type: integer }
        package_price: { type: integer, minimum: 1 }
        discount: { type: integer }
        additional_fee: { type: integer }
        fee_description: { type: string }
        due_date: { type: string, format: date }
        notes: { type: string }

    InvoiceGenerate:
      type: object
      required: [period_month, period_year, due_day]
      properties:
        period_month: { type: integer }
        period_year: { type: integer }
        due_day: { type: integer }

    Payment:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        invoice_id: { type: string }
        amount: { type: integer }
        payment_method: { type: string }
        gateway: { type: string }
        gateway_trx_id: { type: string }
        gateway_status: { type: string }
        status: { type: string }
        paid_at: { type: string, format: date-time, nullable: true }
        expired_at: { type: string, format: date-time, nullable: true }
        collected_by: { type: string, nullable: true }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        invoice: { $ref: "#/components/schemas/Invoice" }

    PaymentCreate:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, minimum: 1 }
        payment_method: { type: string }
        notes: { type: string }

    Ticket:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        customer_id: { type: string }
        ticket_number: { type: string }
        subject: { type: string }
        description: { type: string }
        category: { type: string }
        priority: { type: string }
        status: { type: string }
        assigned_to: { type: string, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        customer: { $ref: "#/components/schemas/Customer" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/TicketMessage" }

    TicketCreate:
      type: object
      required: [customer_id, subject]
      properties:
        customer_id: { type: string }
        subject: { type: string }
        description: { type: string }
        category: { type: string }
        priority: { type: string }

    TicketMessage:
      type: object
      properties:
        id: { type: string }
        ticket_id: { type: string }
        sender_type: { type: string }
        sender_id: { type: string }
        message: { type: string }
        attachment_url: { type: string }
        created_at: { type: string, format: date-time }

    OLT:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        hostname: { type: string, nullable: true }
        ip_address: { type: string }
        vendor: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serial_number: { type: string, nullable: true }
        total_pon_ports: { type: integer }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        snmp_community: { type: string }
        status: { type: string }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pon_ports:
          type: array
          items: { $ref: "#/components/schemas/PONPort" }

    OLTCreate:
      type: object
      required: [name, ip_address]
      properties:
        name: { type: string }
        hostname: { type: string }
        ip_address: { type: string }
        vendor: { type: string }
        model: { type: string }
        serial_number: { type: string }
        total_pon_ports: { type: integer }
        latitude: { type: number }
        longitude: { type: number }
        snmp_community: { type: string }
        status: { type: string }
        notes: { type: string }

    PONPort:
      type: object
      properties:
        id: { type: string }
        olt_id: { type: string }
        port_number: { type: integer }
        description: { type: string, nullable: true }
        status: { type: string }

    PONPortCreate:
      type: object
      required: [port_number]
      properties:
        port_number: { type: integer, minimum: 1 }
        description: { type: string }

    ODP:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        olt_id: { type: string, nullable: true }
        splitter_id: { type: string, nullable: true }
        name: { type: string }
        address: { type: string, nullable: true }
        latitude: { type: number }
        longitude: { type: number }
        total_ports: { type: integer }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ports:
          type: array
          items: { $ref: "#/components/schemas/ODPPort" }
        olt: { $ref: "#/components/schemas/OLT" }
        splitter: { $ref: "#/components/schemas/Splitter" }

    ODPCreate:
      type: object
      required: [name, latitude, longitude]
      properties:
        olt_id: { type: string }
        splitter_id: { type: string }
        name: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        total_ports: { type: integer }
        notes: { type: string }

    ODPPort:
      type: object
      properties:
        id: { type: string }
        odp_id: { type: string }
        port_number: { type: integer }
        customer_id: { type: string, nullable: true }
        status: { type: string }
        notes: { type: string, nullable: true }
        customer: { $ref: "#/components/schemas/Customer" }

    ODPPortCreate:
      type: object
      required: [port_number]
      properties:
        port_number: { type: integer, minimum: 1 }
        customer_id: { type: string }
        notes: { type: string }

    Splitter:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        pon_port_id: { type: string, nullable: true }
        parent_splitter_id: { type: string, nullable: true }
        name: { type: string }
        splitter_type: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
