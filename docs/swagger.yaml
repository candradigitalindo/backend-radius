        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token]
              properties:
                fcm_token: { type: string }
      responses:
        "200":
          description: Perangkat dihapus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

