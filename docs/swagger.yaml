            application/json:
              schema: { $ref: "#/components/schemas/CustomerLog" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Settings ──
  /settings:
    get:
      tags: [Settings]
      summary: List all settings
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: { type: string } }
    post:
      tags: [Settings]
      summary: Set a setting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
                value: { type: string }
      responses:
        "200":
          description: Setting saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  key: { type: string }

  /settings/bulk:
    put:
      tags: [Settings]
      summary: Bulk set settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /settings/{key}:
    get:
      tags: [Settings]
      summary: Get setting by key
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Setting value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Setting" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Settings]
      summary: Delete setting
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  # ── Subscription ──
  /subscription/plans:
    get:
      tags: [Subscription]
      summary: List active subscription plans
      responses:
        "200":
          description: Subscription plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SubscriptionPlan" }

  /subscription/plans/{id}:
    get:
      tags: [Subscription]
      summary: Get subscription plan detail
      parameters: [{ $ref: "#/components/parameters/IDPath" }]
      responses:
        "200":
          description: Subscription plan detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SubscriptionPlan" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subscription/subscribe:
    post:
      tags: [Subscription]
      summary: Create subscription order for current tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionSubscribeRequest" }
      responses:
        "201":
          description: Subscription order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SubscriptionOrder" }

  /subscription/orders:
    get:
      tags: [Subscription]
      summary: List current tenant subscription orders
      parameters:
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/PerPageParam" }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Subscription orders
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PaginationMeta" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SubscriptionOrder" }

  /subscription/orders/{id}:
    get:
      tags: [Subscription]
      summary: Get subscription order detail
      parameters: [{ $ref: "#/components/parameters/IDPath" }]
      responses:
        "200":
          description: Subscription order detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SubscriptionOrder" }
        "404": { $ref: "#/components/responses/NotFound" }

  /subscription/orders/{id}/pay:
    post:
      tags: [Subscription]
      summary: Create payment link for subscription order
      parameters: [{ $ref: "#/components/parameters/IDPath" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionCreatePaymentRequest" }
      responses:
        "201":
          description: Payment link created
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }

  /subscription/orders/{id}/confirm:
    post:
      tags: [Subscription]
      summary: Confirm subscription payment
      parameters: [{ $ref: "#/components/parameters/IDPath" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionConfirmPaymentRequest" }
      responses:
        "200":
          description: Subscription payment confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SubscriptionOrder" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Tenant (current) ──
  /tenant:
    get:
      tags: [Tenants]
      summary: Get current tenant
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
    put:
      tags: [Tenants]
      summary: Update current tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantCreate" }
      responses:
        "200":
          description: Tenant updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }

  /tenant/settings:
    put:
      tags: [Tenants]
      summary: Update tenant integration settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wa_api_key: { type: string }
                wa_sender: { type: string }
                pg_provider: { type: string }
                pg_api_key: { type: string }
                pg_secret_key: { type: string }
                pg_merchant_id: { type: string }
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  # ── Tenants (superadmin) ──
  /tenants:
    get:
      tags: [Tenants]
      summary: List tenants (superadmin)
      parameters:
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/PerPageParam" }
        - { $ref: "#/components/parameters/SearchParam" }
        - { name: plan, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Paginated tenants
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PaginationMeta" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Tenant" }
    post:
      tags: [Tenants]
      summary: Create tenant (superadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantCreate" }
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }

  /tenants/{id}:
    get:
      tags: [Tenants]
      summary: Get tenant by ID (superadmin)
      parameters: [{ $ref: "#/components/parameters/IDPath" }]
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Dashboard ──
  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Get dashboard stats
      parameters:
        - { name: month, in: query, schema: { type: integer } }
        - { name: year, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema: { type: object }

  /dashboard/revenue:
    get:
      tags: [Dashboard]
      summary: Get monthly revenue chart
      parameters:
        - { name: year, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Revenue data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }
                  year: { type: integer }

  # ── Reminders ──
  /reminders:
    get:
      tags: [Reminders]
      summary: List reminders
      parameters:
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/PerPageParam" }
      responses:
        "200":
          description: Paginated reminders
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PaginationMeta" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Reminder" }
    post:
      tags: [Reminders]
      summary: Create reminder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderCreate" }
      responses:
        "201":
          description: Reminder created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }

  /reminders/{id}:
    get:
      tags: [Reminders]
      summary: Get reminder by ID
      parameters: [{ $ref: "#/components/parameters/IDPath" }]
      responses:
        "200":
          description: Reminder detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Reminders]
      summary: Update reminder
      parameters: [{ $ref: "#/components/parameters/IDPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderCreate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
    delete:
      tags: [Reminders]
      summary: Delete reminder
      parameters: [{ $ref: "#/components/parameters/IDPath" }]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /reminders/trigger:
    post:
      tags: [Reminders]
      summary: Trigger all active reminders
      description: |
        Triggers all active reminders for the current tenant.
        For each reminder, calculates target date based on type + days_offset,
        queries unpaid invoices matching that date, and sends WhatsApp messages asynchronously.
      responses:
        "200":
          description: Reminders triggered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  # ── WhatsApp Session Management ──
  /whatsapp/sessions/start:
    post:
      tags: [WhatsApp]
      summary: Start WhatsApp session
      description: Start a new WhatsApp session for the tenant. After starting, scan QR code from the QR endpoint.
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WASessionStatus" }

  /whatsapp/sessions/status:
    get:
      tags: [WhatsApp]
      summary: Get WhatsApp session status
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WASessionStatus" }

  /whatsapp/sessions/qr:
    get:
      tags: [WhatsApp]
      summary: Get QR code for WhatsApp pairing
      description: Returns a base64-encoded PNG QR code image for scanning with WhatsApp mobile app.
      responses:
        "200":
          description: QR code data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      qr: { type: string, description: "Base64 data URL of QR code image" }

  /whatsapp/sessions:
    delete:
      tags: [WhatsApp]
      summary: Stop WhatsApp session
      responses:
        "200":
          description: Session stopped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /whatsapp/send:
    post:
      tags: [WhatsApp]
      summary: Send a single WhatsApp message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, message]
              properties:
                phone: { type: string, example: "081234567890" }
                message: { type: string, example: "Halo, ini pesan test." }
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      status: { type: string }
                      jid: { type: string }
                      timestamp: { type: integer }

  # ── Mobile App ──
  /mobile/auth/login:
    post:
      tags: [Mobile]
      summary: Login pelanggan (nomor pelanggan + password)
      description: |
        Autentikasi pelanggan menggunakan nomor pelanggan dan password.
        Tidak memerlukan tenant_id — data tenant didapat dari response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_code, password]
              properties:
                customer_code: { type: string, example: "260327001" }
                password: { type: string, example: "password123" }
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    $ref: "#/components/schemas/MobileTokenPair"
                  customer:
                    $ref: "#/components/schemas/MobileCustomer"
        "401":
          description: Nomor pelanggan atau password salah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Akun belum diaktivasi (password belum diset)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /mobile/profile:
    get:
      tags: [Mobile]
      summary: Get profil pelanggan
      responses:
        "200":
          description: Profil pelanggan
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/MobileCustomerDetail"
        "404":
          description: Pelanggan tidak ditemukan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /mobile/invoices:
    get:
      tags: [Mobile]
      summary: List tagihan pelanggan
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Daftar tagihan
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items: { $ref: "#/components/schemas/MobileInvoice" }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }

  /mobile/packages:
    get:
      tags: [Mobile]
      summary: List paket internet tersedia
      responses:
        "200":
          description: Daftar paket
          content:
            application/json:
              schema:
                type: object
                properties:
                  packages:
                    type: array
                    items: { $ref: "#/components/schemas/MobilePackage" }

  /mobile/tickets:
    get:
      tags: [Mobile]
      summary: List tiket pelanggan
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Daftar tiket
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items: { $ref: "#/components/schemas/MobileTicket" }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
    post:
      tags: [Mobile]
      summary: Buat tiket baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, description]
              properties:
                subject: { type: string, example: "Internet lambat" }
                description: { type: string, example: "Speed hanya 2 Mbps padahal paket 20 Mbps" }
                category: { type: string, enum: [general, gangguan, billing, upgrade, lainnya], default: general }
                priority: { type: string, enum: [low, medium, high, urgent], default: medium }
      responses:
        "201":
          description: Tiket dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    $ref: "#/components/schemas/MobileTicket"

  /mobile/tickets/{id}:
    get:
      tags: [Mobile]
      summary: Detail tiket beserta pesan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail tiket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    allOf:
                      - $ref: "#/components/schemas/MobileTicket"
                      - type: object
                        properties:
                          messages:
                            type: array
                            items: { $ref: "#/components/schemas/TicketMessage" }

  /mobile/tickets/{id}/messages:
    post:
      tags: [Mobile]
      summary: Balas tiket
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, example: "Masih lambat, mohon dicek lagi" }
      responses:
        "201":
          description: Pesan ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/TicketMessage"

  /mobile/upgrade:
    post:
      tags: [Mobile]
      summary: Ajukan upgrade paket
      description: Membuat tiket otomatis dengan kategori "upgrade".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package_id]
              properties:
                package_id: { type: string }
                notes: { type: string, example: "Ingin upgrade ke paket 30 Mbps" }
      responses:
        "201":
          description: Permintaan upgrade terkirim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

