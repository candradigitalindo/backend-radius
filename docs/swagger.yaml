          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Daftar reward
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Reward" }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
    post:
      tags: [Rewards]
      summary: Buat program reward baru
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardInput" }
      responses:
        "201":
          description: Reward dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Reward" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /rewards/stats:
    get:
      tags: [Rewards]
      summary: Statistik ringkasan reward tenant
      responses:
        "200":
          description: Statistik reward
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RewardStats" }

  /rewards/dashboard:
    get:
      tags: [Rewards]
      summary: Dashboard lengkap program reward
      parameters:
        - name: months
          in: query
          schema: { type: integer, default: 12, minimum: 1, maximum: 24 }
          description: Rentang bulan untuk tren
      responses:
        "200":
          description: Dashboard reward
          content:
            application/json:
              schema:
                type: object
                properties:
                  months: { type: integer }
                  data: { $ref: "#/components/schemas/RewardDashboard" }

  /rewards/{id}:
    get:
      tags: [Rewards]
      summary: Detail program reward
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail reward
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Reward" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Rewards]
      summary: Update program reward
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardInput" }
      responses:
        "200":
          description: Reward diperbarui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Rewards]
      summary: Hapus program reward
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reward dihapus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Referrals ──
  /referrals:
    get:
      tags: [Referrals]
      summary: Daftar referral
      parameters:
        - name: customer_id
          in: query
          schema: { type: string }
          description: Filter berdasarkan customer (referrer atau referred)
        - name: status
          in: query
          schema: { type: string, enum: [pending, qualified, rewarded, expired] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Daftar referral
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Referral" }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }

  /referrals/{id}:
    get:
      tags: [Referrals]
      summary: Detail referral
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail referral
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Referral" }
        "404": { $ref: "#/components/responses/NotFound" }

  /referrals/{id}/reward:
    post:
      tags: [Referrals]
      summary: Tandai referral sudah diberi reward (manual admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Referral ditandai diberi reward
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Reward Claims ──
  /reward-claims:
    get:
      tags: [RewardClaims]
      summary: Daftar klaim reward
      parameters:
        - name: customer_id
          in: query
          schema: { type: string }
          description: Filter klaim milik customer tertentu
        - name: status
          in: query
          schema: { type: string, enum: [pending, applied, expired] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Daftar klaim
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RewardClaim" }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }

  /reward-claims/{claimId}/apply:
    post:
      tags: [RewardClaims]
      summary: Terapkan klaim ke customer
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Klaim diterapkan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: Klaim tidak ditemukan atau sudah applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reward-claims/balance/{id}:
    get:
      tags: [RewardClaims]
      summary: Cek total saldo klaim pending milik customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Customer ID
      responses:
        "200":
          description: Saldo klaim pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance: { type: integer, example: 150000 }
